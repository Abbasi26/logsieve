name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Check the pattern library
        run: logsieve patterns --check
      - name: Demo and explain smoke test
        run: |
          logsieve demo --output demo-out
          logsieve explain 0x8024402C
          logsieve diagnose src/logsieve/demo_logs --format json --output demo-out/report.json
          python -c "import json; d=json.load(open('demo-out/report.json')); assert d['suspected_cause']['id']=='wu-name-not-resolved'"
  cmtraceopen-bridge:
    # Optional backend. The default install and the pytest job above need no Rust.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the bridge
        working-directory: contrib/cmtraceopen-bridge
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --release --locked
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test against the real engine
        env:
          LOGSIEVE_CMTRACEOPEN: ${{ github.workspace }}/contrib/cmtraceopen-bridge/target/release/logsieve-cmtraceopen
        run: |
          python -m pytest tests/test_cmtraceopen_bridge.py -rs
          logsieve diagnose tests/fixtures/CBS.log --parser cmtraceopen --format json --output bridge-out
          python -c "import json; d=json.load(open('bridge-out/report.json')); assert d['timeline'], d"
