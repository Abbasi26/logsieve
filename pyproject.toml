[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsieve"
version = "0.1.0"
description = "Local-first diagnosis for Windows, ConfigMgr, and Intune client logs, with reversible pseudonymization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wasaf Abbasi" }]
keywords = ["logs", "intune", "mecm", "configmgr", "privacy", "windows"]
dependencies = [
  "cryptography>=42",
  "python-evtx>=0.8",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
logsieve = "logsieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logsieve = ["patterns/library/*.yaml", "demo_logs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"