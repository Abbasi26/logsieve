[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "logsieve"
version = "0.2.0"
description = "Local-first diagnosis for Windows, ConfigMgr, and Intune client logs, with reversible pseudonymization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wasaf Abbasi" }]
keywords = ["logs", "intune", "mecm", "configmgr", "privacy", "windows"]
dependencies = [
  "cryptography==50.0.2",
  "python-evtx==0.8.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
logsieve = "logsieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logsieve = ["patterns/library/*.yaml", "demo_logs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"