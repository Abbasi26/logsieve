  constant: CERT_E_EXPIRED
  codes: ["0x800B0101"]
  severity: error
  confidence: high
  uncertain: false
  category: auth
  symptom_of: []
  area: windows
  explanation: >
    Microsoft's Windows Update corruption article lists 0x800B0101 as
    CERT_E_EXPIRED: a required certificate is not within its validity period
