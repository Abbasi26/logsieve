- id: hash-value-incorrect
  title: The hash value is not correct
  codes: ["0x80091007"]
  severity: error
  confidence: high
  uncertain: false
  category: hash
  symptom_of: []
  area: mecm
  explanation: >
    Microsoft's Configuration Manager application error reference lists
    0x80091007 as "The hash value is not correct". The same article says the
    hash of a file is not correct, that this is typically seen in CAS.log,
    and that a sharing violation during the hash check (for example security
    software scanning the file) can cause it because Configuration Manager
    expects exclusive access while it hashes.
  fix_hints:
    - Compare the content hash with the package on the distribution point. Rebuild and redistribute if the content changed.
    - If CAS.log shows a sharing violation on the same file, find the process that has it open.
  sources:
    - https://learn.microsoft.com/en-us/intune/configmgr/tenant-attach/app-install-error-reference
  self_test: "The hash value is not correct 0x80091007"

- id: win-unspecified
  title: Unspecified error
  codes: ["0x80004005"]
  severity: error
  confidence: low
  uncertain: true
  category: generic
  symptom_of: []
  area: windows
  explanation: >
    Microsoft's Configuration Manager application error reference lists
    0x80004005 as "Unspecified error". It does not identify a cause. The
    lines immediately before it matter more than the code.
  fix_hints:
    - Do not treat this code as a root cause. Read the previous error in the same component.
  sources:
    - https://learn.microsoft.com/en-us/intune/configmgr/tenant-attach/app-install-error-reference
  notes: Uncertain as a diagnosis. The code is real and generic.
  self_test: "failed 0x80004005"