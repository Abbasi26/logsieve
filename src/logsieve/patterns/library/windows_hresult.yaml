- id: sxs-hash-mismatch
  title: A component file does not match its manifest
  constant: ERROR_SXS_FILE_HASH_MISMATCH
  codes: ["0x800736CC"]
  severity: error
  confidence: high
  uncertain: false
  category: hash
  symptom_of: []
  area: servicing
  explanation: >
    Microsoft's Windows Update corruption article lists 0x800736CC as
    ERROR_SXS_FILE_HASH_MISMATCH: a component file does not match the
