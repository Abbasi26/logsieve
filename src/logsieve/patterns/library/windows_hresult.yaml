- id: cbs-store-corrupt
  title: Component store is corrupt
  constant: CBS_E_STORE_CORRUPTION
  codes: ["0x800f0831"]
  severity: error
  confidence: high
  uncertain: false
  category: content
  symptom_of: []
  area: servicing
  explanation: >
    Microsoft's Windows Update corruption article lists 0x800f0831 as
    CBS_E_STORE_CORRUPTION: the CBS store is corrupted.
  fix_hints:
