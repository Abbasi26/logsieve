# WIN32-facility HRESULTs and a few servicing codes.
# 0x8007xxxx = 0x80070000 + the Win32 system error. Microsoft documents that
# facility in MS-ERREF. Where a Windows Update article states the HRESULT
# itself, that article is listed too.

- id: win-file-not-found
  title: The system cannot find the file specified
  constant: ERROR_FILE_NOT_FOUND
  codes: ["0x80070002"]
  severity: error
  confidence: high
  uncertain: false
  category: content
  symptom_of: ["name-resolution", "network"]
  area: windows
  explanation: >
    0x80070002 is ERROR_FILE_NOT_FOUND (Win32 code 2). Microsoft's Windows
    Update corruption article states that description for this HRESULT.
    In an update or app log it often means a payload, source, or path the
    installer expected is missing. It does not by itself say why.
  fix_hints:
    - Identify the path in the surrounding lines. The code only says that path was missing.
  sources:
    - https://learn.microsoft.com/en-us/troubleshoot/windows-server/installing-updates-features-roles/fix-windows-update-errors
    - https://learn.microsoft.com/en-us/windows/win32/debug/system-error-codes--0-499-
  self_test: "error 0x80070002"

- id: win-path-not-found
  title: The system cannot find the path specified
  constant: ERROR_PATH_NOT_FOUND
  codes: ["0x80070003"]
  severity: error
  confidence: high
  uncertain: false
  category: content
  symptom_of: []
  area: windows
  explanation: >
    0x80070003 is the WIN32-facility HRESULT for system error 3,
    ERROR_PATH_NOT_FOUND. The directory portion of a path does not exist.
  fix_hints:
    - Check the parent directory in the same log line, not only the file name.
  sources:
    - https://learn.microsoft.com/en-us/windows/win32/debug/system-error-codes--0-499-
    - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-erref/0642cb2f-2075-4469-918c-4441e69c548a
  self_test: "error 0x80070003"

- id: win-access-denied
  title: Access is denied
  constant: ERROR_ACCESS_DENIED
  codes: ["0x80070005"]
  severity: error
  confidence: high
  uncertain: false
  category: auth
  symptom_of: []
  area: windows
  explanation: >
    0x80070005 is the WIN32-facility HRESULT for system error 5,
    ERROR_ACCESS_DENIED. Something the installer or service touched rejected
    the account it was running as.
  fix_hints:
    - Note which account ran the action. A user-context install and a SYSTEM-context install fail this code for different reasons.
  sources:
    - https://learn.microsoft.com/en-us/windows/win32/debug/system-error-codes--0-499-
    - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-erref/0642cb2f-2075-4469-918c-4441e69c548a
  self_test: "error 0x80070005"

- id: win-disk-full
  title: There is not enough space on the disk
  constant: ERROR_DISK_FULL
  codes: ["0x80070070"]
  severity: error
  confidence: high
  uncertain: false
  category: disk
  symptom_of: []
  area: windows
  explanation: >
    0x80070070 is the WIN32-facility HRESULT for system error 112,
    ERROR_DISK_FULL.
  fix_hints:
    - Free space on the volume named in the log. Include the cache volume, not only the system drive, when the line mentions one.
  sources:
