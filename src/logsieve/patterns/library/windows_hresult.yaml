  self_test: "error 0x80070070"

- id: win-cancelled
  title: The operation was cancelled
  constant: ERROR_CANCELLED
  codes: ["0x800704C7"]
  severity: warning
  confidence: high
  uncertain: false
  category: install
  symptom_of: []
  area: windows
  explanation: >
    0x800704C7 is the WIN32-facility HRESULT for system error 1223,
    ERROR_CANCELLED. The operation was cancelled, often by the user or by a
    caller that closed the request.
  fix_hints:
    - Check whether a person cancelled the install or a management tool aborted it.
  sources:
    - https://learn.microsoft.com/en-us/windows/win32/debug/system-error-codes--1000-1299-
  self_test: "error 0x800704C7"

