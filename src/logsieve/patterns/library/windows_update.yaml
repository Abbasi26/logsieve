- id: wu-bad-hash
  title: Windows Update file digest was not recognised
  constant: WU_E_DM_INCORRECTFILEHASH
  codes: ["0x80246002"]
  severity: error
  confidence: high
  uncertain: false
  category: hash
  symptom_of: []
  area: windows-update
  explanation: >
    WU_E_DM_INCORRECTFILEHASH. Microsoft's description is that a download
    manager operation could not be completed because the file digest was not
    recognised.
  fix_hints:
    - Re-download the content. A proxy that caches or inspects the payload can corrupt it.
    - On WSUS, check that the content on disk matches what the metadata describes.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
