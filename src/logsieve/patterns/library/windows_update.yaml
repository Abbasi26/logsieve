    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
  self_test: "WU_E_PT_SUS_SERVER_NOT_SET 0x80244011"

- id: wu-install-not-allowed
  title: Windows Update install blocked by another install or a pending restart
  constant: WU_E_INSTALL_NOT_ALLOWED
  codes: ["0x80240016"]
  severity: error
  confidence: high
  uncertain: false
  category: reboot
  symptom_of: []
  area: windows-update
  explanation: >
    WU_E_INSTALL_NOT_ALLOWED. Microsoft's description is that an install was
    attempted while another installation was in progress or the system was
    pending a mandatory restart.
  fix_hints:
    - Restart the device if a servicing operation is pending, then retry.
    - Do not stack a second installer on top of one that is still running.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
  self_test: "error 0x80240016"

