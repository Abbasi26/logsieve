# Windows Update Agent codes.
# Meanings are paraphrased from Microsoft's component list. The constant and
# the hex value are the identifier; the source page is the authority.
# https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference

- id: wu-name-not-resolved
  title: Windows Update cannot resolve the server name
  constant: WU_E_PT_WINHTTP_NAME_NOT_RESOLVED
  codes: ["0x8024402C"]
  severity: error
  confidence: high
  uncertain: false
  category: name-resolution
  symptom_of: []
  area: windows-update
  explanation: >
    WU_E_PT_WINHTTP_NAME_NOT_RESOLVED. Microsoft documents this as the same
    condition as ERROR_WINHTTP_NAME_NOT_RESOLVED: the proxy name or the target
    server name cannot be resolved. On a client that uses WSUS, that usually
    means the WSUS hostname. On a client that goes direct, it points at local
    DNS or the path to the Windows Update service.
  fix_hints:
    - From the client, resolve the Windows Update or WSUS hostname and confirm the answer is the server you expect.
    - Check WinHTTP proxy configuration. A proxy hostname that does not resolve produces this code.
    - Confirm the WUServer value, when policy sets one, is a name the client can resolve.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
    - https://learn.microsoft.com/en-us/troubleshoot/windows-client/installing-updates-features-roles/error-0x8024402c-installing-update-feature-on-demand
  self_test: "Windows Update failed with error 0x8024402C"

- id: wu-http-timeout
  title: Windows Update HTTP request timed out
  constant: WU_E_PT_HTTP_STATUS_REQUEST_TIMEOUT
  codes: ["0x8024401C"]
  severity: error
  confidence: high
  uncertain: false
  category: timeout
  symptom_of: ["network"]
  area: windows-update
  explanation: >
    WU_E_PT_HTTP_STATUS_REQUEST_TIMEOUT. Microsoft maps this to HTTP 408:
    the server timed out waiting for the request.
  fix_hints:
    - Check reachability and latency to the update endpoint, including any proxy hop.
    - Look for a proxy or firewall that closes idle connections before the client finishes the request.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
  self_test: "scan failed 0x8024401C"

- id: wu-proxy-auth
  title: Windows Update proxy authentication required
  constant: WU_E_PT_HTTP_STATUS_PROXY_AUTH_REQ
  codes: ["0x8024401B"]
  severity: error
  confidence: high
  uncertain: false
  category: proxy
  symptom_of: []
  area: windows-update
  explanation: >
    WU_E_PT_HTTP_STATUS_PROXY_AUTH_REQ. Microsoft maps this to HTTP 407:
    the proxy requires authentication.
  fix_hints:
    - Confirm the WinHTTP proxy and whether the machine account can authenticate to it.
    - A user-level proxy that works in a browser can still fail for the Windows Update service.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
  self_test: "proxy returned 0x8024401B"

- id: wu-http-forbidden
  title: Windows Update server refused the request
  constant: WU_E_PT_HTTP_STATUS_FORBIDDEN
  codes: ["0x80244018"]
  severity: error
  confidence: high
  uncertain: false
  category: auth
  symptom_of: []
  area: windows-update
  explanation: >
    WU_E_PT_HTTP_STATUS_FORBIDDEN. Microsoft maps this to HTTP 403:
    the server understood the request and declined it.
  fix_hints:
    - Check WSUS or upstream permissions and any device-based filter in front of the update service.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
  self_test: "error 0x80244018"

- id: wu-http-not-found
  title: Windows Update URI was not found
  constant: WU_E_PT_HTTP_STATUS_NOT_FOUND
  codes: ["0x80244019"]
  severity: error
  confidence: high
  uncertain: false
  category: network
  symptom_of: []
  area: windows-update
  explanation: >
    WU_E_PT_HTTP_STATUS_NOT_FOUND. Microsoft maps this to HTTP 404:
    the server cannot find the requested URI.
  fix_hints:
    - Compare the client's update URL with the service that is actually answering.
    - A WSUS content path that was removed or a bad port produces a 404.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
  self_test: "error 0x80244019"

- id: wu-service-unavailable
  title: Windows Update service temporarily unavailable
  constant: WU_E_PT_HTTP_STATUS_SERVICE_UNAVAIL
  codes: ["0x80244022"]
  severity: error
  confidence: high
  uncertain: false
  category: network
  symptom_of: []
  area: windows-update
  explanation: >
    WU_E_PT_HTTP_STATUS_SERVICE_UNAVAIL. Microsoft maps this to HTTP 503:
    the service is temporarily overloaded.
  fix_hints:
    - Retry after the update server or WSUS application pool has recovered.
    - If every client fails at once, look at the server rather than one device.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
  self_test: "error 0x80244022"

- id: wu-server-not-set
  title: Windows Update intranet server policy is missing
  constant: WU_E_PT_SUS_SERVER_NOT_SET
  codes: ["0x80244011"]
  severity: error
  confidence: high
  uncertain: false
  category: policy
  symptom_of: []
  area: windows-update
  explanation: >
    WU_E_PT_SUS_SERVER_NOT_SET. Microsoft's description is that the WUServer
    policy value is missing in the registry.
  fix_hints:
    - If the client is supposed to use an intranet update service, confirm the policy that sets WUServer is applied.
    - If the client should use Windows Update directly, remove a partial intranet configuration.
