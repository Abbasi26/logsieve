- id: wu-service-not-running
  title: Windows Update service is not running
  codes: ["0x80070422"]
  severity: error
  confidence: high
  uncertain: false
  category: service
  symptom_of: []
  area: windows-update
  explanation: >
    Microsoft's Windows Update error list describes 0x80070422 as the Windows
    Update service having stopped or not running. The same HRESULT is the
    WIN32-facility form of system error 1058 (ERROR_SERVICE_DISABLED): the
    service cannot be started because it is disabled or has no enabled devices.
  fix_hints:
    - Check the startup type and state of wuauserv, and of the services it depends on.
    - A policy or configuration profile may be disabling the service on purpose.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
    - https://learn.microsoft.com/en-us/windows/win32/debug/system-error-codes--1000-1299-
  self_test: "service failed 0x80070422"

- id: wu-file-locked
  title: Windows Update could not replace a file that is in use
  codes: ["0x80070020"]
  severity: error
  confidence: high
  uncertain: false
  category: install
  symptom_of: []
  area: windows-update
  explanation: >
    Microsoft lists 0x80070020 as InstallFileLocked: the installer could not
    access the file because it is already in use. The same page notes that
    this happens when antivirus, antimalware, or backup software is scanning
    the file the installer wants to replace.
  fix_hints:
    - Retry after a restart so the lock is gone.
    - Check which process holds the file if the failure repeats.
  sources:
    - https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
  self_test: "error 0x80070020"

- id: wu-event-20
  title: Windows Update Client event 20
  severity: error
  confidence: medium
  uncertain: true
  category: install
  symptom_of: []
  area: windows-update
  event_ids:
    - provider: Microsoft-Windows-WindowsUpdateClient
      id: "20"
  explanation: >
    A published System log sample uses Event ID 20 from
    Microsoft-Windows-WindowsUpdateClient with the message text
    "Installation Failure: Windows failed to install the following update".
    A Microsoft Q&A answer summarises ID 20 as installation failed. Event IDs
    are only meaningful with the provider, and the error code inside the
    message is the reliable part. This entry is marked uncertain because the
    ID-to-meaning note is community documentation plus one published sample,
    not an official event reference.
  fix_hints:
    - Read the error code in the same event and match that, rather than stopping at event 20.
  sources:
    - https://learn.microsoft.com/en-us/answers/questions/2757085/event-id-20
  notes: >
    Uncertain. Prefer the HRESULT in the event message.
  self_test: "Installation Failure: Windows failed to install the following update"
  self_test_provider: Microsoft-Windows-WindowsUpdateClient
  self_test_event_id: "20"