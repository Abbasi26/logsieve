  area: windows-update
  explanation: >
    WU_E_ALL_UPDATES_FAILED. Microsoft's description is that the operation
    failed for all the updates. The useful detail is usually an earlier code
    in the same log.
  fix_hints:
    - Read the earlier error in the same scan. This code is the summary, not the cause.
